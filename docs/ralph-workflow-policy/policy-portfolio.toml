schema_version = "v1"
default_budget_seconds = 60.0
kernel_controls = ["policy-structure", "public-behavior"]

[context]
impact = "low"
likelihood = "low"
uncertainty = "low"
recoverability = "high"
architectures = ["library"]
rate_of_change = "medium"
expected_lifetime = "long"
obligations = []

[[lanes]]
id = "default"
owner = "project maintainers"
trigger = "every change"

[[lanes]]
id = "triggered"
owner = "domain owner"
trigger = "declared risk or platform signal"

[[lanes]]
id = "human"
owner = "reviewer"
trigger = "judgment-dependent material change"

[[controls]]
id = "policy-structure"
protected_outcome = "Project policy remains deterministic, bounded, and internally consistent"
fault_sensitivity = "Detects malformed or contradictory policy composition before agent work"
layer = "deterministic preflight"
owner = "project maintainers"
trigger = "every change"
lane = "default"
marginal_cost_seconds = 0.1
evidence = "validator finding list and composed portfolio record"
lifecycle = "review on every portfolio schema change; replace only with equivalent deterministic coverage"
disposition = "KEEP"

[[controls]]
id = "public-behavior"
protected_outcome = "Material behavior claims are proven through public surfaces"
fault_sensitivity = "Detects claims supported only by narration or implementation-private observations"
layer = "black-box scenario"
owner = "project maintainers"
trigger = "material behavior change"
lane = "default"
marginal_cost_seconds = 0.5
evidence = "preserved public-surface artifact with immutable subject, run, validated oracle, and independent verdict"
lifecycle = "review when the public contract or cheapest sufficient proof layer changes"
disposition = "KEEP"

[local_tightening]
controls = []


[[controls]]
id = "explore-linux-inotify-probe"
protected_outcome = "Explore leaves no Linux inotify watches after an indexed-search workload"
fault_sensitivity = "The removed test inspected a child process's Linux /proc fdinfo state, which is unavailable on supported developer hosts"
layer = "one-off platform receipt"
owner = "domain owner"
trigger = "Linux watcher implementation change"
lane = "triggered"
marginal_cost_seconds = 0.0
evidence = "scripts/explore_inotify_probe.sh opens the ExploreStore, runs a five-query grep_files workload, and tallies the inotify watch count by counting lines beginning with 'inotify wd:' inside /proc/<pid>/fdinfo (the actual per-watch kernel record; the earlier 'watches:' prefix counted zero against any live inotify descriptor). The script aborts non-zero when the count is non-zero. Linux-host developers rerun the script on every watcher implementation change and attach the dated stdout to the change."
lifecycle = "remove from the default suite; rerun the probe on every Linux implementation change and attach the dated receipt to the change"
disposition = "REMOVE"

[[controls]]
id = "retired-root-operational-doc-guards"
protected_outcome = "Retired repo-root operational guides contain current guidance"
fault_sensitivity = "The removed tests always skipped because their retired guide paths are absent from a clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "documentation-route change"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "canonical Sphinx routes and documented retirement decisions (wt-026 docs/dedup); surviving contract enforced by test_operational_guides_exist and test_no_stale_rust_workflow_references in ralph-workflow/tests/test_repo_root_operational_docs_sync.py"
lifecycle = "remove absent-path guards; add an objective test only for a current canonical route"
disposition = "REMOVE"


[[controls]]
id = "retired-root-performance-doc-guards"
protected_outcome = "Retired repo-root performance guides retain their historical labels"
fault_sensitivity = "Every test in the removed file skipped because the archived performance directory is absent from a clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "historical archive restoration"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "archive restoration review and the documentation map's historical-route classification; the orphan constant tests/doc_roots.py:REPO_ROOT_DOCS_PERFORMANCE_DIR was removed in wt-01 since the imported test no longer exists"
lifecycle = "remove absent-archive guards; review any restored archive as a documentation change"
disposition = "REMOVE"


[[controls]]
id = "default-template-parallel-keys"
protected_outcome = "Tracked default ralph-workflow TOML templates do not expose global parallelization keys"
fault_sensitivity = "A regression that re-introduces a top-level parallel_execution/max_parallel_workers/max_work_units key in the tracked ralph-workflow.toml or ralph-workflow-local.toml template would re-enable cross-pipeline parallel switches that the design forbids"
layer = "objective TOML key check"
owner = "project maintainers"
trigger = "default template change"
lane = "default"
marginal_cost_seconds = 0.05
evidence = "ralph-workflow/tests/test_no_global_parallelization_config.py::test_ralph_workflow_toml_has_no_global_parallel_keys asserts no top-level forbidden key exists in either tracked template; companion test_pipeline_toml_has_no_top_level_parallel_execution covers pipeline.toml and test_unified_config_has_no_forbidden_parallel_fields covers the UnifiedConfig model surface"
lifecycle = "keep; rerun on every change to the tracked default templates or to UnifiedConfig"
disposition = "KEEP"

[[controls]]
id = "retired-code-style-leaf-guards"
protected_outcome = "Retired code-style leaves contain historical Rust markers"
fault_sensitivity = "All parameter cases skipped because every retired code-style leaf path is absent from the clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "historical documentation restoration"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "documentation map and archived-route review; re-introductions of any leaf must be guarded by an objective test that targets the re-introduced path"
lifecycle = "remove absent-leaf guards; review restored historical documents as documentation changes"
disposition = "REMOVE"

[[controls]]
id = "retired-absent-agy-execution-strategy"
protected_outcome = "AGY execution strategy defaults classify_quiet returns WAITING_ON_CHILD for unknown states"
fault_sensitivity = "The removed parametrize case always skipped because agy_execution_strategy.py is intentionally absent from the default checkout (AGY runs through the generic strategy pathway)"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "AGY strategy file reintroduction or generic-strategy change"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "base class AgentExecutionState default and the three surviving parametrized cases in ralph-workflow/tests/test_no_anti_drift_recovery_invariants.py::TestClassifyQuietUnknownStateDefaultsToWaiting (opencode, claude_interactive, generic) plus the WAITING_ON_CHILD reference check"
lifecycle = "remove absent-path parametrize case; re-add the AGY case when the file is reintroduced or a generic-strategy regression breaks the contract"
disposition = "REMOVE"

[[controls]]
id = "retired-default-lane-2-prose-guards"
protected_outcome = "AGY/MCP setup documentation does not contain stale PTY-injection wording"
fault_sensitivity = "The removed test_agy_mcp_setup_reflects_pty_injection asserted literal prose phrases such as 'cannot inject a Ralph-only MCP config' against documentation; that is a lane-2 (editorial) judgment, not an objective behaviour contract"
layer = "lane-2 prose-wording elimination"
owner = "docs owner"
trigger = "AGY/MCP setup documentation change"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "docs-owner review note dated 2026-10-03 against f05524607 listed the stale phrases audited and the replacement PTY-injection copy in ralph-workflow/docs/sphinx/architecture/mcp-upstream-proxy.md and ralph-workflow/docs/sphinx/agent-compatibility.md"
lifecycle = "remove prose-wording assertions; owner-driven docs review on every AGY/MCP copy change"
disposition = "REMOVE"

[[controls]]
id = "retired-watchdog-text-call-site-count"
protected_outcome = "watchdog.evaluate(...) is invoked at the canonical 6 call sites in the agent-invoke readers"
fault_sensitivity = "The removed test_watchdog_evaluate_call_sites_unchanged asserted the literal text 'watchdog.evaluate' appears exactly 6 times across two production source files; that is a category-3 implementation-coupled assertion (text-shape), and a behaviour-preserving refactor (e.g. routing the call through a small helper) would have broken it without changing observable behaviour"
layer = "implementation-coupled text elimination"
owner = "project maintainers"
trigger = "watchdog.evaluate public-seam change"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "IdleWatchdog public-surface black-box tests under ralph-workflow/tests/agents/test_idle_watchdog*.py exercise the evaluate() contract end-to-end; the textual call-site count no longer carries independent coverage"
lifecycle = "remove text-shape assertion; rerun the IdleWatchdog family tests on every change to the public evaluate surface"
disposition = "REMOVE"
