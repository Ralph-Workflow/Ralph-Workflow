schema_version = "v1"
default_budget_seconds = 60.0
kernel_controls = ["policy-structure", "public-behavior"]

[context]
impact = "low"
likelihood = "low"
uncertainty = "low"
recoverability = "high"
architectures = ["library"]
rate_of_change = "medium"
expected_lifetime = "long"
obligations = []

[[lanes]]
id = "default"
owner = "project maintainers"
trigger = "every change"

[[lanes]]
id = "triggered"
owner = "domain owner"
trigger = "declared risk or platform signal"

[[lanes]]
id = "human"
owner = "reviewer"
trigger = "judgment-dependent material change"

[[controls]]
id = "policy-structure"
protected_outcome = "Project policy remains deterministic, bounded, and internally consistent"
fault_sensitivity = "Detects malformed or contradictory policy composition before agent work"
layer = "deterministic preflight"
owner = "project maintainers"
trigger = "every change"
lane = "default"
marginal_cost_seconds = 0.1
evidence = "validator finding list and composed portfolio record"
lifecycle = "review on every portfolio schema change; replace only with equivalent deterministic coverage"
disposition = "KEEP"

[[controls]]
id = "public-behavior"
protected_outcome = "Material behavior claims are proven through public surfaces"
fault_sensitivity = "Detects claims supported only by narration or implementation-private observations"
layer = "black-box scenario"
owner = "project maintainers"
trigger = "material behavior change"
lane = "default"
marginal_cost_seconds = 0.5
evidence = "preserved public-surface artifact with immutable subject, run, validated oracle, and independent verdict"
lifecycle = "review when the public contract or cheapest sufficient proof layer changes"
disposition = "KEEP"

[local_tightening]
controls = []


[[controls]]
id = "explore-linux-inotify-probe"
protected_outcome = "Explore leaves no Linux inotify watches after an indexed-search workload"
fault_sensitivity = "The removed test inspected a child process's Linux /proc fdinfo state, which is unavailable on supported developer hosts"
layer = "one-off platform receipt"
owner = "domain owner"
trigger = "Linux watcher implementation change"
lane = "triggered"
marginal_cost_seconds = 0.0
evidence = "dated Linux-host command receipt recorded with the implementation change"
lifecycle = "remove from the default suite; review only when watcher implementation changes"
disposition = "REMOVE"

[[controls]]
id = "retired-root-operational-doc-guards"
protected_outcome = "Retired repo-root operational guides contain current guidance"
fault_sensitivity = "The removed tests always skipped because their retired guide paths are absent from a clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "documentation-route change"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "canonical Sphinx routes and documented retirement decisions"
lifecycle = "remove absent-path guards; add an objective test only for a current canonical route"
disposition = "REMOVE"


[[controls]]
id = "retired-root-performance-doc-guards"
protected_outcome = "Retired repo-root performance guides retain their historical labels"
fault_sensitivity = "Every test in the removed file skipped because the archived performance directory is absent from a clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "historical archive restoration"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "archive restoration review and the documentation map's historical-route classification"
lifecycle = "remove absent-archive guards; review any restored archive as a documentation change"
disposition = "REMOVE"


[[controls]]
id = "retired-default-config-guards"
protected_outcome = "Retired default ralph-workflow TOML templates have no global parallelization keys"
fault_sensitivity = "Both parameterized tests always skipped because neither retired template is tracked in the clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "default template reintroduction"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "default-template inventory and pipeline.toml's retained objective parallelization check"
lifecycle = "remove absent-template guards; add a test only with a current template"
disposition = "REMOVE"

[[controls]]
id = "retired-code-style-leaf-guards"
protected_outcome = "Retired code-style leaves contain historical Rust markers"
fault_sensitivity = "All parameter cases skipped because every retired code-style leaf path is absent from the clean clone"
layer = "vacuity elimination"
owner = "project maintainers"
trigger = "historical documentation restoration"
lane = "human"
marginal_cost_seconds = 0.0
evidence = "documentation map and archived-route review"
lifecycle = "remove absent-leaf guards; review restored historical documents as documentation changes"
disposition = "REMOVE"
