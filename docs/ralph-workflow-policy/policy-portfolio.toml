layer = "category-1 vacuity elimination"
owner = "project maintainers"
trigger = "edit-preview row-width enforcement is reintroduced as a production seam"
lane = "default"
marginal_cost_seconds = 0.0
evidence = "ralph-workflow/ralph/display/edit_preview.py:_build_edit_preview `del width  # reserved for future width-aware wrapping; currently unused` (lines 585-588); grep over ralph/display/edit_preview.py for cell_len returns zero hits; sibling tests in tests/test_display_visual_floor.py (test_visual_floor_partial_fill_fixture_is_rejected, test_visual_floor_silent_elision_fixture_is_rejected, test_visual_floor_palette_pairs_stay_separable_under_cvd_simulation) cover the remaining DA-003 (a)/(/n)/cvd outcomes through the production scene-rendering seam; review note 2026-10-04 confirmed no other suite test asserts a row-width floor on this surface"
