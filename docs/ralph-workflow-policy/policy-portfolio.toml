schema_version = "v1"
default_budget_seconds = 60.0
kernel_controls = ["policy-structure", "public-behavior"]

[context]
impact = "low"
likelihood = "low"
uncertainty = "low"
recoverability = "high"
architectures = ["library"]
rate_of_change = "medium"
expected_lifetime = "long"
obligations = []

[[lanes]]
id = "default"
owner = "project maintainers"
trigger = "every change"

[[lanes]]
id = "triggered"
owner = "domain owner"
trigger = "declared risk or platform signal"

[[lanes]]
id = "human"
owner = "reviewer"
trigger = "judgment-dependent material change"

[[controls]]
id = "policy-structure"
protected_outcome = "Project policy remains deterministic, bounded, and internally consistent"
fault_sensitivity = "Detects malformed or contradictory policy composition before agent work"
layer = "deterministic preflight"
owner = "project maintainers"
trigger = "every change"
lane = "default"
marginal_cost_seconds = 0.1
evidence = "validator finding list and composed portfolio record"
lifecycle = "review on every portfolio schema change; replace only with equivalent deterministic coverage"
disposition = "KEEP"

[[controls]]
id = "public-behavior"
protected_outcome = "Material behavior claims are proven through public surfaces"
fault_sensitivity = "Detects claims supported only by narration or implementation-private observations"
layer = "black-box scenario"
owner = "project maintainers"
trigger = "material behavior change"
lane = "default"
marginal_cost_seconds = 0.5
evidence = "preserved public-surface artifact with immutable subject, run, validated oracle, and independent verdict"
lifecycle = "review when the public contract or cheapest sufficient proof layer changes"
disposition = "KEEP"

[local_tightening]
controls = []


[[controls]]
id = "explore-linux-inotify-probe"
protected_outcome = "Explore leaves no Linux inotify watches after an indexed-search workload"
fault_sensitivity = "The removed test inspected a child process's Linux /proc fdinfo state, which is unavailable on supported developer hosts"
layer = "category-4 one-off platform receipt"
owner = "domain owner"
trigger = "Linux watcher implementation change"
lane = "triggered"
marginal_cost_seconds = 0.0
evidence = "scripts/explore_inotify_probe.sh opens the ExploreStore, runs a five-query grep_files workload, and tallies the inotify watch count by counting lines beginning with 'inotify wd:' inside /proc/<pid>/fdinfo (the actual per-watch kernel record; the earlier 'watches:' prefix counted zero against any live inotify descriptor). The script aborts non-zero when the count is non-zero. Linux-host developers rerun the script on every watcher implementation change and attach the dated stdout to the change."
lifecycle = "remove from the default suite; rerun the probe on every Linux implementation change and attach the dated receipt to the change"
disposition = "REMOVE"

