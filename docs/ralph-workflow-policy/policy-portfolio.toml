schema_version = "v3"
default_budget_seconds = 60.0
kernel_controls = [
    "policy-structure",
    "public-behavior",
]
lanes = [
    { id = "default", owner = "project maintainers", trigger = "every change" },
    { id = "triggered", owner = "domain owner", trigger = "declared risk or platform signal" },
    { id = "human", owner = "reviewer", trigger = "judgment-dependent material change" },
]

[context]
impact = "low"
likelihood = "low"
uncertainty = "low"
recoverability = "high"
architectures = [
    "library",
]
rate_of_change = "medium"
expected_lifetime = "long"
obligations = []

[[controls]]
id = "policy-structure"
protected_outcome = "Project policy remains deterministic, bounded, and internally consistent"
fault_sensitivity = "Detects malformed or contradictory policy composition before agent work"
layer = "deterministic preflight"
owner = "project maintainers"
trigger = "every change"
lane = "default"
marginal_cost_seconds = 0.1
cost_basis = "estimate"
evidence = "validator finding list and composed portfolio record"
lifecycle = "review on every portfolio schema change; replace only with equivalent deterministic coverage"
disposition = "KEEP"
detects = "validator finding list and composed portfolio record"
retirement_trigger = "when the deterministic preflight is replaced by a published equivalent"
enforcement = "deterministic: make -C ralph-workflow verify"

[[controls]]
id = "public-behavior"
protected_outcome = "Material behavior claims are proven through public surfaces"
fault_sensitivity = "Detects claims supported only by narration or implementation-private observations"
layer = "black-box scenario"
owner = "project maintainers"
trigger = "material behavior change"
lane = "default"
marginal_cost_seconds = 0.5
cost_basis = "estimate"
evidence = "preserved public-surface artifact with immutable subject, run, validated oracle, and independent verdict"
lifecycle = "review when the public contract or cheapest sufficient proof layer changes"
disposition = "KEEP"
detects = "preserved public-surface artifact with immutable subject, run, validated oracle, and independent verdict"
retirement_trigger = "when every behavior claim is provable at a cheaper deterministic layer"
enforcement = "deterministic: make -C ralph-workflow verify"

[[controls]]
id = "explore-linux-inotify-probe"
protected_outcome = "Explore leaves no Linux inotify watches after an indexed-search workload"
fault_sensitivity = "An inotify watch registered by the explore substrate during a five-query grep_files workload leaves the substrate subscribed to an indexed directory after the workload ends"
layer = "category-4 one-off platform receipt"
owner = "domain owner"
trigger = "Linux watcher implementation change"
lane = "triggered"
marginal_cost_seconds = 0.0
cost_basis = "estimate"
evidence = "ralph-workflow/scripts/explore_inotify_probe.sh opens the ExploreStore, runs a five-query grep_files workload, and tallies the inotify watch count by counting the lines that begin with 'inotify wd:' inside /proc/<pid>/fdinfo; the script exits non-zero when the count is non-zero. Linux-host developers run the script on every watcher implementation change and attach its stdout to the change."
lifecycle = "the probe is not part of the default verify suite; run it on every Linux watcher implementation change and attach its stdout as the receipt for the change"
disposition = "REMOVE"
detects = "ralph-workflow/scripts/explore_inotify_probe.sh non-zero watch count inside /proc/<pid>/fdinfo"
retirement_trigger = "when the Linux inotify probe is retired or replaced by a portable cross-platform probe"
enforcement = "advisory: platform probe run on Linux implementation changes; review: Linux watcher implementation change"

[[controls]]
id = "type-system-escape-hatch-ban"
protected_outcome = "The per-language ban catalog has zero findings"
fault_sensitivity = "Detects constructs and suppression mechanisms that prevent complete type-checker or linter verification"
layer = "lint and typecheck gate"
owner = "clean-code owner"
trigger = "every maintained-language source change"
lane = "default"
marginal_cost_seconds = 0.0
cost_basis = "estimate"
evidence = "none"
lifecycle = "review when a maintained language, checker, linter, or ban catalog changes"
disposition = "KEEP"
detects = "per-language ban catalog findings"
retirement_trigger = "when every cataloged construct becomes structurally impossible"
enforcement = "deterministic: banned constructs audit (audit_banned_constructs)"

[[controls]]
id = "strictest-lint-configuration"
protected_outcome = "The lint configuration enables every rule and carries no banned-rule bypass"
