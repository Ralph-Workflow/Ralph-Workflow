lane = "default"
marginal_cost_seconds = 0.0
cost_basis = "estimate"
evidence = "none"
lifecycle = "review when the linter, rule set, configuration, or suppression syntax changes"
disposition = "KEEP"
detects = "disabled-rule and banned-rule bypass findings"
retirement_trigger = "when lint configuration bypasses become structurally impossible"
enforcement = "deterministic: lint bypass audit (audit_lint_bypass)"

