[domains]
design-system = "inactive; reason: the project stack declares no UI framework and the repository carries no design token or theme source; review trigger: reactivate when the first UI framework dependency or .tsx/.vue/.svelte source file lands, or at the 2027-02-14 review, whichever comes first"
ux = "inactive; reason: the product is a developer-local CLI with no web or mobile application surface and no UX router dependency; review trigger: reactivate when a UX application framework or its router dependency is added, or at the 2027-02-14 review, whichever comes first"
performance = "inactive; reason: the repository declares no performance budget, benchmark harness, or load-test dependency; review trigger: reactivate when the first performance budget file, benchmark directory, or load-test dependency lands, or at the 2027-02-14 review, whichever comes first"
memory-usage = "inactive; reason: the repository declares no memory budget, soak-test artifact, or heap-profiling dependency; review trigger: reactivate when the first memory budget or soak-test artifact lands, or at the 2027-02-14 review, whichever comes first"
accessibility = "inactive; reason: the project stack declares no UI framework and the repository carries no accessibility tooling or conformance target; review trigger: reactivate together with the design-system domain when the first UI framework or accessibility tool lands, or at the 2027-02-14 review, whichever comes first"
api-compatibility = "inactive; reason: the project publishes no versioned HTTP API contract and no public API reference page; review trigger: reactivate when the first API contract file lands, or at the 2027-02-14 review, whichever comes first"
data-storage = "inactive; reason: the product keeps its state in the local workspace and ships no schema, migration, or database layer; review trigger: reactivate when the first schema or migration directory lands, or at the 2027-02-14 review, whichever comes first"
reliability-observability = "inactive; reason: the product runs as a developer-local process with no deployment manifest, cluster configuration, or operations runbook; review trigger: reactivate when the first deployment manifest or operations runbook lands, or at the 2027-02-14 review, whichever comes first"
privacy = "inactive; reason: the product handles no personal, sensitive, or regulated data under a declared data classification; review trigger: reactivate when the first governed-data document lands, or at the 2027-02-14 review, whichever comes first"
release-deployment = "inactive; reason: releases ship through the Homebrew formula and the Python package index without a dedicated release workflow or release runbook; review trigger: reactivate when the first release workflow or releasing guide lands, or at the 2027-02-14 review, whichever comes first"
