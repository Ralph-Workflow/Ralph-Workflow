name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify CLA
        run: cd ralph-workflow && python -m ralph.contrib.cla

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Run verification gate
        run: cd ralph-workflow && make verify
