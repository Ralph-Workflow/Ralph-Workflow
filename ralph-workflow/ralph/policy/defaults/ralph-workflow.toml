# =============================================================================
#  Ralph Workflow -- user-global configuration
#  ~/.config/ralph-workflow.toml  (or $XDG_CONFIG_HOME/ralph-workflow.toml)
# =============================================================================
#
#  NOTHING TO DO IF YOU USE CLAUDE. This file ships ready to run: if `claude`
#  is on your PATH, change nothing and run `ralph`.
#
#  The ONE thing most operators ever edit is section 1 below -- which model
#  does which job. It is the first thing in the file for that reason.
#
#     1. CHAINS  -- which agent/model does which job   <- edit this
#     2. DRAINS  -- which chain runs which phase       <- rarely changed
#
#  Everything past the OPTIONAL banner is machinery with a working default:
#  the agent CLI definitions, the tuning knobs, the reference notes. You can
#  stop reading at that banner.
#
#  ralph --diagnose           which agent CLIs are installed and usable
#  ralph --regenerate-config  rewrite this file from the bundled default
#                             (your current file is saved to <name>.bak first)
#
# =============================================================================


# =============================================================================
# 1. CHAINS (REQUIRED) -- which agent/model does which job.
# =============================================================================
# A chain is an ORDERED FALLBACK LIST. The first entry is what actually runs;
# the rest are tried, in order, only if it fails or exhausts its retries.
#
# What belongs where:
#   planning, analysis  ->  your most capable model -- these phases review
#                           work and catch mistakes.
#   development         ->  a strong coder model -- this phase edits your files.
#   commit              ->  something small, fast and cheap -- it only writes
#                           commit messages.
#
# Each entry is `agent/model`. One example per supported agent:
#   claude/opus                          codex/gpt-5.4[effort=high]
#   claude-headless/sonnet               opencode/openai/gpt-5.4
#   cursor/claude-opus-4-8[effort=high]  nanocoder/ollama/llama3.1
#   pi/anthropic/claude-sonnet-4:high    agy/"Claude Sonnet 4.6 (Thinking)"
# Full per-agent syntax: docs/sphinx/agent-compatibility.md

[agent_chains]
planning = ["claude/opus"]
development = ["claude/sonnet"]
analysis = ["claude/opus"]
commit = ["claude/haiku"]

# Fallbacks are opt-in. The defaults above name only `claude`, so a one-agent
# install works out of the box. To add one: install the CLI, confirm it is on
# PATH, uncomment its block in the AGENT CLI DEFINITIONS section below, then
# extend the list:
#   development = ["claude/sonnet", "codex", "opencode/openai/gpt-5.4"]
#   planning = ["ccs/work"]   # CCS -- see docs/sphinx/configuration.md#ccs_aliases


# =============================================================================
# 2. DRAINS (REQUIRED) -- which chain runs which pipeline phase.
# =============================================================================
# A drain is a routing label: `phase = "chain name from section 1"`.
# The bundled pipeline uses exactly this set. Change a value only to point a
# phase at a different chain.

[agent_drains]
planning = "planning"
planning_analysis = "analysis"
development = "development"
development_analysis = "analysis"
development_commit = "commit"
analysis = "analysis"
commit = "commit"


# =============================================================================
# OPTIONAL -- everything below this line has a working default.
# Skip it unless you know you need something here.
# =============================================================================


# -----------------------------------------------------------------------------
# AGENT CLI DEFINITIONS -- how to invoke each coding-agent CLI.
# -----------------------------------------------------------------------------
# This is transport plumbing (binary name, flags, output parser), not a
# preference. You only come here to SWITCH CLIs: comment out the active block
# below, uncomment ONE of the inactive blocks after it, then name that agent
# from [agent_chains] in section 1.
#
# `ralph --diagnose` reports which CLIs are installed; a detected CLI may be
# uncommented for you automatically.

# --- ACTIVE ------------------------------------------------------------------

[agents.claude]
cmd = "claude"
transport = "claude_interactive"
# Use skip-permissions here because Ralph Workflow confines interactive Claude
# through the Ralph Workflow MCP/tool allowlist; MCP remains the real
# permission boundary.
yolo_flag = "--dangerously-skip-permissions"
verbose_flag = "--verbose"
json_parser = "claude"
session_flag = "--resume {}"
can_commit = true
display_name = "Claude"
# Claude Code's native sub-agent / task tooling is enabled by default in
# this build. Plans that declare work_units / parallel_plan are
# dispatched to the executing agent's sub-agents; Ralph-managed fan-out
# stays dormant. Set to false to force sequential execution.
subagent_capability = true

