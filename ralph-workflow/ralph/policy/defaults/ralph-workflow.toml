# =============================================================================
# EDIT THIS — REQUIRED FOR YOUR FIRST RUN
# =============================================================================
# This file is your USER-GLOBAL Ralph Workflow config. Most operators leave
# every default below, but two sections are REQUIRED to review before your
# first run:
#
#   1. [agents.*]  -- pick the active agent block that matches the coding
#                     agent CLI you already have installed. The bundled
#                     ``[agents.claude]`` block below is uncommented so a
#                     fresh install works out of the box when ``claude`` is
#                     on PATH. Uncomment ONE OTHER block instead to switch
#                     agents (or install another CLI; see --diagnose).
#
#   2. [agent_chains] -- each chain is an ORDERED FALLBACK LIST. The active
#                       ``development`` chain decides which agent edits your
#                       files. The bundled defaults reference only the
#                       ``claude`` agent so a one-agent first run works;
#                       extend the lists once you install another CLI.
#
# Every other section below is OPTIONAL with a working default -- only edit
# it if you know you need it. The OPTIONAL banner below the [agent_drains]
# block marks the boundary so you can scroll past everything else safely.
#
# For project-local overrides (.agent/ralph-workflow.toml), the same two
# sections are required when that file is used. The companion file
# ``ralph-workflow-local.toml`` is the project-local template.
#
# Ralph Workflow manages a standard eight-file first-run config set:
#   1. ~/.config/ralph-workflow.toml          (user-global main config, this file)
#   2. ~/.config/ralph-workflow-mcp.toml      (user-global MCP config)
#   3. ~/.config/ralph-workflow-pipeline.toml (user-global pipeline defaults)
#   4. ~/.config/ralph-workflow-artifacts.toml (user-global artifact defaults)
#   5. .agent/ralph-workflow.toml             (project-local override)
#   6. .agent/mcp.toml                        (project-local MCP override)
#   7. .agent/pipeline.toml                   (project-local pipeline phases)
#   8. .agent/artifacts.toml                  (project-local artifact contracts)
#
# OVERRIDE PRECEDENCE (highest to lowest):
#   CLI flags > project-local (.agent/) > user-global (~/.config/) > bundled defaults
#
# REGENERATION: Run `ralph --regenerate-config` to refresh all configs from
# bundled defaults. Existing files are backed up to <name>.bak before overwrite.
#
# Location: ~/.config/ralph-workflow.toml  (or $XDG_CONFIG_HOME/ralph-workflow.toml)
#
# Project-local overrides live in .agent/ralph-workflow.toml -- values there
# take precedence over this file.
#
# Every non-secret field is listed below with its default value, commented out.
# Uncomment and edit only the fields you want to change; everything else keeps
# its documented default automatically.
#
# For MCP servers and web search, edit ~/.config/ralph-workflow-mcp.toml
# (or .agent/mcp.toml for project-local overrides).

# -----------------------------------------------------------------------------
# ACTIVE AGENT (REQUIRED) -- uncomment to switch the active coding agent.
# -----------------------------------------------------------------------------
# Model-string shorthand (agent -> what to type -> example):
#   claude         -> claude/<model>                  -> claude/opus
#   claude-headless-> claude-headless/<model>         -> claude-headless/sonnet
#   codex          -> codex/<model>[effort=<level>]   -> codex/gpt-5.4[effort=high]
#   opencode       -> opencode/<provider>/<model>     -> opencode/openai/gpt-5.4
#   nanocoder      -> nanocoder/<provider>/<model>    -> nanocoder/ollama/llama3.1
#   agy            -> agy/<display name>              -> agy/"Claude Sonnet 4.6 (Thinking)"
#   pi             -> pi/<provider/model[:thinking]>  -> pi/anthropic/claude-sonnet-4:high
#   cursor         -> cursor/<model id>               -> cursor/claude-opus-4-8[effort=high]
#
# Use these inside [agent_chains] below to point each role at the agent
# whose model format matches. Full syntax and the literal CLI flags are in
# docs/sphinx/agent-compatibility.md.

# @AGENT-BLOCK-START: claude
# [agents.claude]
# cmd = "claude"
# transport = "claude_interactive"
# yolo_flag = "--dangerously-skip-permissions"
# verbose_flag = "--verbose"
# json_parser = "claude"
# session_flag = "--resume {}"
# can_commit = true
# display_name = "Claude"
# @AGENT-BLOCK-END

[agents.claude]
cmd = "claude"
transport = "claude_interactive"
# Use skip-permissions here because Ralph Workflow confines interactive Claude
# through the Ralph Workflow MCP/tool allowlist; MCP remains the real
# permission boundary.
yolo_flag = "--dangerously-skip-permissions"
verbose_flag = "--verbose"
json_parser = "claude"
session_flag = "--resume {}"
can_commit = true
display_name = "Claude"
# Claude Code's native sub-agent / task tooling is enabled by default in
# this build. Plans that declare work_units / parallel_plan are
# dispatched to the executing agent's sub-agents; Ralph-managed fan-out
# stays dormant. Set to false to force sequential execution.
subagent_capability = true

