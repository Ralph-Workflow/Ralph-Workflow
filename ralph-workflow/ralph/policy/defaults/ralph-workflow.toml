# -----------------------------------------------------------------------------
# ACTIVE CHAINS (REQUIRED) -- each chain is an ORDERED FALLBACK LIST.
# -----------------------------------------------------------------------------
# Each chain is an ORDERED FALLBACK LIST: Ralph Workflow tries the first agent, and
# if it fails (or exhausts its retries) it moves to the next one. The
# first entry is what you actually run; the rest are the safety net.
#
# What KIND of model belongs where (plain language):
#   - planning / analysis  -> your most capable, reviewer-grade model.
#                            These phases review work and catch mistakes.
#   - development          -> a strong coder model.
#                            This phase edits files and runs the loop.
#   - commit               -> a small/cheap/fast model is fine.
#                            This phase writes a commit message; speed > depth.
#
# The bundled defaults below use ONLY the default-active `claude` agent
# so a fresh first-run with just Claude installed works out of the box --
# no other agent binary is required. Once you install another agent and
# verify it on PATH, uncomment one of the examples below to extend the
# fallback chain. Each entry is `agent/model`; agent supports multi-segment
# forms like `opencode/<provider>/<model>` (see
# docs/sphinx/agent-compatibility.md for the full syntax per agent).

[agent_chains]
planning = ["claude/opus"]
development = [
  "claude/sonnet",
]
analysis = ["claude/opus"]
commit = ["claude/haiku"]

# After you install opencode and confirm `opencode` is on PATH:
#   development = ["claude/sonnet", "opencode/openai/gpt-5.4"]
# After you install codex:
#   development = ["claude/sonnet", "codex", "opencode/openai/gpt-5.4"]
# CCS alternative example: planning = ["ccs/work"]
# See docs/sphinx/configuration.md#ccs_aliases for CCS details.

# -----------------------------------------------------------------------------
# DRAIN-TO-CHAIN BINDINGS (REQUIRED) -- which chain handles which pipeline role.
# -----------------------------------------------------------------------------
# A drain is a ROUTING LABEL that binds a pipeline phase to a chain.
# (The chain itself is the ordered fallback list above; the drain is the
# "which chain handles the planning phase?" answer.)
#
# Edit this only if you are changing which chain handles a role.
#
# IMPORTANT: the bundled pipeline uses the drain set below.

[agent_drains]
planning = "planning"
planning_analysis = "analysis"
development = "development"
development_analysis = "analysis"
development_commit = "commit"
analysis = "analysis"
commit = "commit"

# Edit this only if you want a specific agent for prompt refinement.
# [prompt_helper]
# Omit agent = to use the first configured agent in [agents.*]; if no agents are
# configured, Ralph Workflow falls back to the built-in "opencode" agent.
# Uncomment and set agent = to force a specific agent instead:
# agent = "claude"

# =============================================================================
# OPTIONAL -- everything below this line has a working default.
# Skip this section unless you know you need it.
# =============================================================================

# Edit this only if you need to change Ralph Workflow's normal workflow settings.
# -----------------------------------------------------------------------------
# [general] -- Core workflow settings
# -----------------------------------------------------------------------------
[general]
# =============================================================================
# AUTO-INTEGRATION (auto-rebase) -- keep the feature branch and the mainline
# in lockstep.
# ----------------------------------------------------------------------------
# What the feature does: rebase the feature branch onto the live local target
# at every seam, fall back to an endpoint merge on conflict (optionally
# agent-resolved), and fast-forward the local target to the integrated feature
# tip. On-by-default local tier (rebase + merge + fast-forward) runs at every
# auto-integrate seam: the commit seam, every phase boundary whose worktree is
# clean, run startup, and inside each parallel worker. The opt-in remote tier
# (auto_integrate_remote_sync_enabled = true) extends the on-by-default local
# tier to also keep <remote_target>/<target> in step with the local mainline
# and to push every successful landing to the configured remote.
#
# When it runs (the seams): startup, pre/post planning, before/after
# development, after a commit phase that produced a commit, every successful
# phase boundary whose worktree is clean, and inside each manifest-launched
# parallel worker (crash recovery, a startup catch-up and a per-phase
# boundary of its own). A fifth seam at the Ralph-managed parallel fan-out
# join is wired but DORMANT under bundled dispatch_mode = "agent_subagents".
#
# What it never does: never force-pushes; never rewrites remote history
# (`refs/heads/<target>` only ever advances); never creates a branch from a
# remote-tracking ref (the target is a STATELESS local-refs-only check);
# never moves past a non-fast-forward push without first running the bounded
# reconcile loop; never blocks pipeline work in the end-of-run waiting
# state; never fails the run on a remote error -- transient remote
# failures degrade to local-only integration with a recorded reason and
# the run continues. The remote-sync tier is OFF by default.
#
# On-by-default local tier (auto_integrate_enabled = true): the strict-local
# integration described above. Setting auto_integrate_enabled = false keeps
# git behavior byte-identical to runs without auto-integration.
#
# Opt-in remote tier (auto_integrate_remote_sync_enabled = true): adds a
# throttled pull that reconciles the local mainline with the configured
# remote mainline, a push of the local mainline to the configured remote
# after every successful local landing, and a bounded
# fetch -> rebase-target-onto-remote -> push reconcile loop on non-fast-forward
# rejections, with exponential jittered backoff. Never block pipeline work.
# =============================================================================
# auto_integrate_enabled = true            # ON by default; the on-by-default local tier. Rebases onto the current local target, falls back to endpoint merge on conflict, and fast-forwards the local target. Equality/ancestor cases are fast-forward-or-noop outcomes. Set to false for byte-identical manual git control.
# auto_integrate_target = ""               # shared integration branch name. The default value (None) is unset -- auto-detect from origin/HEAD -> main -> master. Set to a non-empty string (e.g. "develop") to force a specific local branch; resolution is a stateless local-refs-only check.
# auto_integrate_fetch_enabled = false     # when false (default) the auto-integration probe is local-only. When true, a bounded read-only `git fetch origin <target>` runs before each attempt purely to OBSERVE origin's position; the fetch never moves a local ref, never pushes, never affects the rebase/merge/landing.
# auto_integrate_fetch_timeout_seconds = 10.0    # per-fetch wall-clock budget; > 0, <= 120. On timeout or any remote failure the step falls back to local-only integration and the run is never failed.
# auto_integrate_push_enabled = false     # DEPRECATED alias for remote sync. When true it enables only the single remote below.
# auto_integrate_push_timeout_seconds = 30.0  # per-push wall-clock budget; > 0, <= 300. A timeout records an unpublished local landing and never fails the run.
# --- opt-in remote-sync tier: setting the next key to true implies auto_integrate_fetch_enabled = true ---
# auto_integrate_remote_sync_enabled = false   # OFF by default; the opt-in remote-sync tier. When true a throttled pull reconciles the local mainline with the configured remote mainline, every successful local landing is pushed to the configured remote, a rejected push runs the bounded reconcile-onto-remote loop with exponential jittered backoff, and a run that finishes with an unpushed target can opt into a visible end-of-run waiting state.
# auto_integrate_remote_target = "origin"      # configured remote name to sync the local target branch against. Any configured remote is accepted; the push side only ever touches this one remote.
# auto_integrate_remote_sync_interval_seconds = 300.0  # minimum wall-clock seconds between two PULLS for a given `(root, remote, target)` triple; 0 means every seam. A failed fetch does NOT arm the next window; only a healthy fetch arms it.
# auto_integrate_remote_backoff_max_seconds = 300.0    # per-remote exponential jittered backoff ceiling after consecutive remote-side failures; base is auto_integrate_remote_sync_interval_seconds. Bounds the GAP between attempts; never the NUMBER of attempts.
# auto_integrate_remote_wait_seconds = 0.0     # how long a FINISHED run may sit in the visible waiting-for-remote state when it still holds an unpushed target. 0 (default) preserves today's exit behavior verbatim -- record "landed locally, not published to <remote>: <reason>" and exit. Positive opt-ins to wait: retry on the backoff until this cap or success; interruptible.
# auto_integrate_resolve_timeout_seconds = 900.0  # ONE wall-clock ceiling SHARED by the complete conflict-resolution operation; > 0, <= 7200. Every rebase stop, every round within a stop, and every sequential candidate agent invocation draw down this single budget.

# verbosity = 2                         # 0=quiet 1=normal 2=verbose 3=full 4=debug
# telemetry_enabled = true              # anonymous metadata-only telemetry is on by default. Set false to opt out. Ralph Workflow uses this data only to improve reliability/product quality, understand active usage and feature adoption, and inform users about useful capabilities. It is never sold, rented, or shared for advertising.
# Loop iteration caps live in pipeline.toml [loop_counters.*] (see ralph --explain-policy).
# Override budget caps with: ralph --counter <name>=<value> (e.g. --counter iteration=8).
# developer_context = 1                 # developer context level (>=1)
# prompt_path = "/path/to/PROMPT.md"    # override default PROMPT.md path (comment out to use default)
# templates_dir = "/path/to/templates"  # user templates directory (comment out to use bundled)
# git_user_name = "Your Name"           # git author name for commits (comment out to use git config)
# git_user_email = "you@example.com"    # git author email for commits (comment out to use git config)
# max_same_agent_retries = 10           # max consecutive retries on the same agent (>=0)
# max_commit_residual_retries = 10      # max extra residual commit retries (>=0)
# max_retries = 3                       # max retries per agent attempt (>=0)
# retry_delay_ms = 1000                 # base delay between retries in ms (>=0)
# backoff_multiplier = 2.0              # exponential backoff multiplier (>=1.0)
# max_backoff_ms = 60000                # maximum retry backoff delay in ms (>=0)
# max_cycles = 3                        # max full fallback cycles through a drain (>=1)
# execution_history_limit = 1000        # max execution history entries in memory (>=1)
# agent_idle_timeout_seconds = 300.0    # max idle seconds before killing a stalled agent process (>0)
# agent_idle_max_waiting_on_child_seconds = 1800.0  # hard ceiling on cumulative WAITING_ON_CHILD deferral (>0)
# agent_waiting_status_interval_seconds = 30.0      # periodic status emission cadence while WAITING_ON_CHILD (>0)
# agent_suspect_waiting_on_child_seconds = 600.0    # suspicion threshold; emits a warning but does not stop the run (<max_waiting_on_child_seconds)
# agent_idle_no_progress_waiting_on_child_seconds = 600.0  # no-progress ceiling; fires when child alive but not making progress (<=max_waiting_on_child_seconds)
# agent_os_descendant_only_ceiling_seconds = 120.0  # short ceiling (~120s) for OS-descendant-only case; fires CHILDREN_PERSIST_TOO_LONG in ~120s instead of waiting for the no-progress ceiling. None disables.
# agent_no_progress_quiet_minimum_invocation_seconds = 120.0  # dumb-kill floor for NO_PROGRESS_QUIET: the watchdog cannot fire this reason within the first N seconds of an agent run, so a recently-launched agent doing real thinking work (planning, exploration, dispatching subagents) but with no first-party evidence yet is not killed. Must be > 0 when set; 0 is rejected. None disables (not recommended). SESSION_CEILING_EXCEEDED is unaffected.
# agent_os_descendant_only_suspect_seconds = 60.0   # earlier SUSPECTED_FROZEN (~60s) for OS-descendant-only case; fires at min(suspect, this value). None disables.
# agent_cpu_idle_seconds = 60.0                     # CPU idle probe: known descendant with 0 CPU for this long is reported as CPU_IDLE_WHILE_ALIVE. None disables.
# agent_log_growth_seconds = 30.0                  # log-growth probe: per-run .agent/raw/{safe_id}.log not grown for this long is reported as LOG_STALE_WHILE_ALIVE. None disables.
# agent_idle_activity_evidence_ttl_seconds = 30.0   # per-channel activity TTL; defers NO_OUTPUT_DEADLINE while MCP tool calls, subagent work, or workspace events are fresher than this TTL. Workspace evidence is collected whenever a run has a workspace_path, even when show_progress is disabled. A subagent that is alive but silent on every channel is NOT treated as activity. Set to 0.0 to disable and restore legacy stdout-only behavior. (>=0)
# agent_workspace_change_weights = { source = 1.0, log = 0.0, cache = 0.0, artifact = 0.0, other = 0.0 }   # per-kind workspace file-change weights; values are BINARY (0.0 = drop, 1.0 = full activity). The default is conservative: only source-code changes count. Operators who relied on log-file activity to defer the verdict can opt in by setting `agent_workspace_change_weights = { log = 1.0, source = 1.0 }`. The five keys are: source (source code / documentation), log (*.log / *.tmp / *.bak / *.swp / *~ / *.pyc / *.pyo), cache (.git / __pycache__ / .pytest_cache / .mypy_cache / .ruff_cache / node_modules / .venv / .agent/tmp / .agent/raw / completion_seen_*.json), artifact (.agent/artifacts), and other (anything else). See docs/agents/timeout-policy.md for the full migration note.
# agent_process_monitor_enabled = true              # enable the agent-agnostic process monitor that discovers and classifies spawned subagents
# agent_subagent_output_capture_enabled = true      # enable polling of observable subagent output streams as first-party evidence
# agent_subagent_output_poll_interval_seconds = 1.0 # poll interval for subagent output streams (>0)

