# =============================================================================
#  Ralph Workflow -- project-local configuration
#  .agent/ralph-workflow.toml  (relative to your project root)
# =============================================================================
#
#  YOU USUALLY DO NOT NEED THIS FILE. `ralph --init` seeds it with working
#  defaults, and every value here just overrides the same key in the
#  user-global ~/.config/ralph-workflow.toml.
#
#  Edit it when THIS project needs a different model than your global setup
#  -- that is section 1 below, and it is the only common reason to be here.
#
#     1. CHAINS  -- which agent/model does which job, for this project
#     2. DRAINS  -- which chain runs which phase, for this project
#
#  Everything past the OPTIONAL banner is machinery with a working default.
#  You can stop reading there.
#
#  NOT IN THIS FILE: how to invoke each agent CLI (binary, flags, parser).
#  That plumbing lives in ~/.config/ralph-workflow-agents.toml.
#
# =============================================================================


# =============================================================================
# 1. CHAINS -- which agent/model does which job, for THIS project.
# =============================================================================
# A chain is an ORDERED FALLBACK LIST. The first entry is what actually runs;
# the rest are tried, in order, only if it fails or exhausts its retries.
#
# What belongs where:
#   planning, analysis  ->  your most capable model -- these phases review
#                           work and catch mistakes.
#   development         ->  a strong coder model -- this phase edits your files.
#   commit              ->  something small, fast and cheap -- it only writes
#                           commit messages.
#
# Each entry is `agent/model`. One example per supported agent:
#   claude/opus                          codex/gpt-5.4[effort=high]
#   claude-headless/sonnet               opencode/openai/gpt-5.4
#   cursor/claude-opus-4-8[effort=high]  nanocoder/ollama/llama3.1
#   pi/anthropic/claude-sonnet-4:high    agy/"Claude Sonnet 4.6 (Thinking)"
# Full per-agent syntax: docs/sphinx/agent-compatibility.md

[agent_chains]
planning = ["claude/opus"]
development = ["claude/sonnet"]
analysis = ["claude/opus"]
commit = ["claude/haiku"]

# Fallbacks are opt-in. The defaults above name only `claude`, so a one-agent
# install works out of the box. To add one: install the CLI, confirm it is on
# PATH, then extend the list:
#   development = ["claude/sonnet", "codex", "opencode/openai/gpt-5.4"]
#   planning = ["ccs/work"]   # CCS -- see docs/sphinx/configuration.md#ccs_aliases


# =============================================================================
# 2. DRAINS -- which chain runs which pipeline phase, for THIS project.
# =============================================================================
# A drain is a routing label: `phase = "chain name from section 1"`.
# The bundled pipeline uses exactly this set. Change a value only to point a
# phase at a different chain.

[agent_drains]
planning = "planning"
planning_analysis = "analysis"
development = "development"
development_analysis = "analysis"
development_commit = "commit"
analysis = "analysis"
commit = "commit"



# =============================================================================
# OPTIONAL -- everything below this line has a working default.
# Skip it unless you know you need something here.
#
# From here down every key is shown commented out at its default value;
# uncomment only the ones you want to change. MCP servers and web search
# live in .agent/mcp.toml (or ~/.config/ralph-workflow-mcp.toml), not here.
# =============================================================================

# Edit this only if you need to change Ralph Workflow's normal workflow settings.
# -----------------------------------------------------------------------------
# [general] -- Core workflow settings
# -----------------------------------------------------------------------------
[general]
# =============================================================================
# AUTO-INTEGRATION (auto-rebase) — keep the feature branch and the mainline
# in lockstep.
# -----------------------------------------------------------------------------
# What the feature does: rebases feature work onto the configured local target,
# resolves conflicts through the normal endpoint-merge fallback, then
# fast-forwards that target when the result is safe to land.
#
# When it runs (the seams): startup, commit, phase boundary, parallel worker
# startup/boundary, and the Ralph-managed parallel fan-out join.
#
# What it never does: force-move a ref, force-push, push a feature branch,
# leave a rebase or merge in progress, or fail the run because remote sync
# failed. The on-by-default local tier is safe; the opt-in remote tier syncs.
# Set auto_integrate_enabled = false for byte-identical manual git behavior:
# no rebase, merge, ref movement, fetch, or push from this feature.
# =============================================================================
# auto_integrate_enabled = true     # local integration at every seam; set false for manual git control.
# auto_integrate_target = "main"    # required local mainline branch; a missing branch records a skip.
# auto_integrate_remote_enabled = false  # opt-in remote tier: fetch, reconcile, and push after a local landing.
# auto_integrate_remote = "origin"  # configured remote used only when remote integration is enabled.

# verbosity = 2                         # 0=quiet 1=normal 2=verbose 3=full 4=debug
# telemetry_enabled = true              # anonymous metadata-only telemetry is on by default. Set false to opt out for this project. Ralph Workflow uses this data only to improve reliability/product quality, understand active usage and feature adoption, and inform users about useful capabilities. It is never sold, rented, or shared for advertising.
# Loop iteration caps live in pipeline.toml [loop_counters.*] (see ralph --explain-policy).
# Override budget caps with: ralph --counter <name>=<value> (e.g. --counter iteration=8).
# developer_context = 1                 # developer context level (>=1)
# prompt_path = "/path/to/PROMPT.md"    # override default PROMPT.md path (comment out to use default)
# templates_dir = "/path/to/templates"  # user templates directory (comment out to use bundled)
# git_user_name = "Your Name"           # git author name for commits (comment out to use git config)
# git_user_email = "you@example.com"    # git author email for commits (comment out to use git config)
# max_same_agent_retries = 10           # max consecutive retries on the same agent (>=0)
# max_commit_residual_retries = 10      # max extra residual commit retries (>=0)
# max_retries = 3                       # max retries per agent attempt (>=0)
# retry_delay_ms = 1000                 # base delay between retries in ms (>=0)
# backoff_multiplier = 2.0              # exponential backoff multiplier (>=1.0)
# max_backoff_ms = 60000                # maximum retry backoff delay in ms (>=0)
# max_cycles = 3                        # max full fallback cycles through a drain (>=1)
# execution_history_limit = 1000        # max execution history entries in memory (>=1)

# [general.workflow] -- Workflow automation flags

[general.workflow]
# checkpoint_enabled = true     # enable checkpoint/resume functionality
# unsafe_mode = false          # merge Ralph Workflow MCP into agent MCP config instead of overwriting it

# Edit this only if you use Claude Code Switch (CCS).
# -----------------------------------------------------------------------------
# [ccs] -- Claude Code Switch (CCS) headless-Claude defaults.
# -----------------------------------------------------------------------------
# CCS is the explicitly-headless Claude path. Configure [ccs_aliases] to run
# Claude non-interactively (--print --output-format=stream-json). For unattended
# interactive Claude use the built-in "claude" or "claude/MODEL" agents instead.
[ccs]
# output_flag = "--output-format=stream-json"
# yolo_flag = "--permission-mode auto"
# verbose_flag = "--verbose"
# print_flag = "--print"
# streaming_flag = "--include-partial-messages"
# json_parser = "claude"
# session_flag = "--resume {}"
# can_commit = true

# Edit this only if you need a named CCS model alias for THIS project.
# -----------------------------------------------------------------------------
# [ccs_aliases.*] -- CCS alias mappings (string or table form)
# -----------------------------------------------------------------------------
# Simple string form (uses built-in defaults for the named alias):
# ccs_aliases = { claude = "claude", opencode = "opencode" }
#
# Table form (override per-alias CCS settings):
# [ccs_aliases.claude]
# cmd = "claude"
# model_flag = "--model claude-sonnet-4"
# can_commit = true
#
# [ccs_aliases.opencode]
# cmd = "opencode"
# model_flag = "--model opencode-o3"
# can_commit = false
