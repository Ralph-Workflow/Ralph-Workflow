# =============================================================================
# OPTIONAL OVERRIDE FILE -- usually you do NOT need to edit this.
# =============================================================================
# Location: .agent/ralph-workflow.toml  (relative to your project root)
#
# This file overrides the user-global ~/.config/ralph-workflow.toml.
# Values here take precedence over the global file.
#
# Most projects never touch this file. Ralph Workflow seeds a working
# default from the bundled template at `ralph --init` time and the bundled
# defaults are tuned for the default-active `claude` agent so a one-agent
# first run works with no project-local edits at all.
#
# If you DO edit it, the same two sections as the user-global file are
# required when this file is in use:
#
#   1. [agents.*]  -- an uncommented block here REPLACES the user-global
#                     active agent for this project. Most projects leave
#                     the global agent alone.
#   2. [agent_chains] -- per-project chain overrides win over the user-global
#                       chains. Most projects leave the global chains alone.
#
# Every other section below is OPTIONAL with a working default -- only edit
# it if you know you need it.
#
# Every non-secret field is listed below with its default value, commented out.
# Uncomment and edit only the fields you want to change; everything else keeps
# its documented default automatically.
#
# For MCP servers and web search, edit .agent/mcp.toml (project-local)
# or ~/.config/ralph-workflow-mcp.toml (user-global).

# -----------------------------------------------------------------------------
# ACTIVE AGENT OVERRIDE (REQUIRED ONLY IF THIS PROJECT SWITCHES AGENTS)
# -----------------------------------------------------------------------------
# [agents.*] -- Agent definitions
# Uncomment and adjust to add or override agents for THIS project only.

# [agents.claude]
# cmd = "claude"
# transport = "claude_interactive"
# Use skip-permissions here because Ralph Workflow confines interactive Claude
