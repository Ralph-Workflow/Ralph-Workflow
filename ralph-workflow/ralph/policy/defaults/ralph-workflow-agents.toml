# =============================================================================
#  Ralph Workflow -- agent CLI definitions
#  ~/.config/ralph-workflow-agents.toml
# =============================================================================
#
#  YOU ALMOST NEVER EDIT THIS FILE. It records HOW to invoke each coding-agent
#  CLI -- binary name, flags, output parser. That is transport plumbing, not a
#  preference. Which model does which job is `[agent_chains]` in
#  ralph-workflow.toml; that is the file you want.
#
#  You come here for exactly one reason: to SWITCH which CLI is active.
#  Comment out the ACTIVE block, uncomment ONE of the INACTIVE blocks, then
#  name that agent from [agent_chains] in ralph-workflow.toml.
#
#  `ralph --diagnose` reports which CLIs are installed; a detected CLI may be
#  uncommented for you automatically.
#
#  Full per-agent flag reference: docs/sphinx/agent-compatibility.md
#
# =============================================================================

# --- ACTIVE ------------------------------------------------------------------

[agents.claude]
cmd = "claude"
transport = "claude_interactive"
# Use skip-permissions here because Ralph Workflow confines interactive Claude
# through the Ralph Workflow MCP/tool allowlist; MCP remains the real
# permission boundary.
yolo_flag = "--dangerously-skip-permissions"
verbose_flag = "--verbose"
json_parser = "claude"
session_flag = "--resume {}"
can_commit = true
display_name = "Claude"
# Claude Code's native sub-agent / task tooling is enabled by default in
# this build. Plans that declare work_units / parallel_plan are
# dispatched to the executing agent's sub-agents; Ralph-managed fan-out
# stays dormant. Set to false to force sequential execution.
subagent_capability = true

# --- INACTIVE (uncomment ONE to switch) --------------------------------------

