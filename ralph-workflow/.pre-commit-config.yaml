repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        files: ^ralph-workflow/(ralph|tests)/
      - id: end-of-file-fixer
        files: ^ralph-workflow/(ralph|tests)/
      - id: check-yaml
      - id: check-added-large-files
      - id: check-toml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix]
        files: ^ralph-workflow/(ralph|tests)/
      - id: ruff-format
        files: ^ralph-workflow/(ralph|tests)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --directory ralph-workflow --locked python -m mypy ralph/
        language: system
        pass_filenames: false
        files: ^ralph-workflow/ralph/
