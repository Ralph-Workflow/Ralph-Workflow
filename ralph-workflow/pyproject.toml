[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ralph-workflow"
dynamic = ["version"]
description = "AI agent orchestrator and software factory: give it a spec and your own checks, and it runs plan, build, verify, fix as a configurable workflow graph across Git worktrees with the coding agent you already use."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE"]
authors = [{ name = "Mistlight" }]
maintainers = [{ name = "Mistlight" }]
keywords = ["ai", "agent", "orchestration", "coding", "software-factory", "git-worktrees", "coding-agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Natural Language :: English",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pygments>=2.18",
  "rich-click>=1.8",
  "questionary>=2.0",
  "mcp>=1.27.0",
  "packaging>=23.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "loguru>=0.7",
  "tqdm>=4.66",
  "watchdog>=4.0",
  "gitpython>=3.1",
  "ddgs>=9.14.0",
  "readability-lxml>=0.8.1",
  "selectolax>=0.3.21",
  "psutil>=5.9",
  "sentry-sdk>=2.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "hatch",
  "ruff",
  "mypy",
  "pathspec>=1.0.4",
  "types-psutil>=5.9",
  "hypothesis>=6.100",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.6",
  "pydantic>=2.7",
  "vulture>=2.16",
  "readability-lxml>=0.8.1",
  "selectolax>=0.3.21",
]
web-search = [
  "tavily-python>=0.7.23",
  "exa-py>=2.12.0",
  "brave-search-python-client>=0.4.27",
]
docs = [
  "sphinx>=7",
  "myst-parser",
  "linkify-it-py>=2",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
]
bundle = ["pyinstaller>=6.0"]

[project.scripts]
ralph = "ralph.cli.main:app"
ralph-mcp = "ralph.mcp.server.runtime:main"

[project.urls]
Homepage = "https://ralphworkflow.com"
Documentation = "https://ralphworkflow.com/docs"
Repository = "https://github.com/Ralph-Workflow/Ralph-Workflow"
Issues = "https://github.com/Ralph-Workflow/Ralph-Workflow/issues/new"
Community = "https://github.com/Ralph-Workflow/Ralph-Workflow/issues"
"Codeberg Mirror" = "https://codeberg.org/RalphWorkflow/Ralph-Workflow"
Changelog = "https://github.com/Ralph-Workflow/Ralph-Workflow/blob/main/ralph-workflow/CHANGELOG.md"

[tool.hatch.version]
source = "code"
path = "ralph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ralph"]
force-include = { "_sitecustomize_shim.py" = "sitecustomize.py" }
include = [
  "ralph/prompts/templates/**/*.jinja",
  "ralph/policy/defaults/*.toml",
  "ralph/mcp/artifacts/format_docs/*.md",
  "ralph/mcp/artifacts/format_docs/examples/*.md",
  "ralph/skills/content/**/*.md",
  "ralph/project_policy/starters/**/*.md",
  "ralph/project_policy/starters/*.toml",
]

[tool.hatch.build.targets.sdist]
include = [
  "/ralph",
  "/README.md",
  "/LICENSE",
  "/_sitecustomize_shim.py",
  "/ralph/prompts/templates/**/*.jinja",
  "/ralph/mcp/artifacts/format_docs/*.md",
  "/ralph/mcp/artifacts/format_docs/examples/*.md",
  "/ralph/skills/content/**/*.md",
  "/ralph/project_policy/starters/**/*.md",
  "/ralph/project_policy/starters/*.toml",
]

[tool.hatch.envs.publish]
dependencies = ["hatch"]

[tool.hatch.publish.index]
url = "https://upload.pypi.org/legacy/"
auth = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "ANN",
  "B",
  "C4",
