[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ralph-workflow"
dynamic = ["version"]
description = "AI agent orchestrator and software factory: give it a spec and your own checks, and it runs plan, build, verify, fix as a configurable workflow graph across Git worktrees with the coding agent you already use."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
license-files = ["LICENSE"]
authors = [{ name = "Mistlight" }]
maintainers = [{ name = "Mistlight" }]
keywords = ["ai", "agent", "orchestration", "coding", "software-factory", "git-worktrees", "coding-agents"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Natural Language :: English",
  "Topic :: Software Development :: Build Tools",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "pygments>=2.18",
  "rich-click>=1.8",
  "questionary>=2.0",
  "mcp>=1.27.0",
  "packaging>=23.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "jinja2>=3.1",
  "loguru>=0.7",
  "tqdm>=4.66",
  "watchdog>=4.0",
  "gitpython>=3.1",
  "ddgs>=9.14.0",
  "readability-lxml>=0.8.1",
  "selectolax>=0.3.21",
  "psutil>=5.9",
  "sentry-sdk>=2.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4",
  "hatch",
  "ruff",
  "mypy",
  "pathspec>=1.0.4",
  "types-psutil>=5.9",
  "hypothesis>=6.100",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.0",
  "pytest-xdist>=3.6",
  "pydantic>=2.7",
  "vulture>=2.16",
  "readability-lxml>=0.8.1",
  "selectolax>=0.3.21",
]
web-search = [
  "tavily-python>=0.7.23",
  "exa-py>=2.12.0",
  "brave-search-python-client>=0.4.27",
]
docs = [
  "sphinx>=7",
  "myst-parser",
  "linkify-it-py>=2",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.5",
]
bundle = ["pyinstaller>=6.0"]

[project.scripts]
ralph = "ralph.cli.main:app"
ralph-mcp = "ralph.mcp.server.runtime:main"

[project.urls]
Homepage = "https://ralphworkflow.com"
Documentation = "https://ralphworkflow.com/docs"
Repository = "https://github.com/Ralph-Workflow/Ralph-Workflow"
Issues = "https://github.com/Ralph-Workflow/Ralph-Workflow/issues/new"
Community = "https://github.com/Ralph-Workflow/Ralph-Workflow/issues"
"Codeberg Mirror" = "https://codeberg.org/RalphWorkflow/Ralph-Workflow"
Changelog = "https://github.com/Ralph-Workflow/Ralph-Workflow/blob/main/ralph-workflow/CHANGELOG.md"

[tool.hatch.version]
source = "code"
path = "ralph/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ralph"]
force-include = { "_sitecustomize_shim.py" = "sitecustomize.py" }
include = [
  "ralph/prompts/templates/**/*.jinja",
  "ralph/policy/defaults/*.toml",
  "ralph/mcp/artifacts/format_docs/*.md",
  "ralph/mcp/artifacts/format_docs/examples/*.md",
  "ralph/skills/content/**/*.md",
  "ralph/project_policy/starters/**/*.md",
  "ralph/project_policy/starters/*.toml",
]

[tool.hatch.build.targets.sdist]
include = [
  "/ralph",
  "/README.md",
  "/LICENSE",
  "/_sitecustomize_shim.py",
  "/ralph/prompts/templates/**/*.jinja",
  "/ralph/mcp/artifacts/format_docs/*.md",
  "/ralph/mcp/artifacts/format_docs/examples/*.md",
  "/ralph/skills/content/**/*.md",
  "/ralph/project_policy/starters/**/*.md",
  "/ralph/project_policy/starters/*.toml",
]

[tool.hatch.envs.publish]
dependencies = ["hatch"]

[tool.hatch.publish.index]
url = "https://upload.pypi.org/legacy/"
auth = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "N",
  "UP",
  "ANN",
  "B",
  "C4",
  "SIM",
  "RUF",
  "TCH",
  "PTH",
  "PERF",
  "PL",
  "PGH",
]

[tool.ruff.lint.per-file-ignores]
"ralph/visual/**/*.py" = [
    "PLR0911",
    "PLR0912",
    "PLR2004",
    "ANN401"
]
"ralph/agents/multimodal_status.py" = [
    "PLR0911",
    "PLR2004"
]
"ralph/agents/delegation_capabilities.py" = [
    "PLR0911",
    "PLR2004"
]
"ralph/agents/vision_agent_provisioning.py" = [
    "PLR0911"
]
"ralph/agents/builtin_spec.py" = [
    "PLR0911",
    "PLR0912",
    "PLC0415"
]
"ralph/agents/support.py" = [
    "PLR0911",
    "PLC0415"
]
"ralph/agents/completion_signals.py" = [
    "PLC0415"
]
"ralph/project_policy/remediation.py" = [
    "PLC0415"
]
"ralph/prompts/__init__.py" = [
    "PLC0415"
]
"ralph/agents/execution_state/_helpers.py" = [
    "PLC0415"
]
"ralph/pipeline/plumbing/smoke_multimodal.py" = [
    "PLR0911",
    "PLR0912",
    "PLC0415"
]
"ralph/pipeline/plumbing/smoke_plumbing.py" = [
    "PLR0911",
    "PLR0912",
    "PLC0415"
]
"ralph/mcp/multimodal/capabilities.py" = [
    "PLR0911"
]
"tests/**/*.py" = [
    "PLR2004",
    "TC002",
    "RUF043",
    "PERF401",
    "PLR0124",
    "N802",
    "TC003",
    "ANN001",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN401",
    "E501",
    "PLC0415",
]
"ralph/cli/**/*.py" = ["PLC0415"]
"ralph/config/**/*.py" = ["PLC0415"]
"ralph/mcp/tool_contract.py" = ["PLC0415"]
"ralph/mcp/server/_snapshots.py" = ["PLC0415"]
"ralph/mcp/upstream/tool_catalog_cache.py" = ["PLC0415"]
"ralph/workspace/context.py" = ["PLC0415"]
"tests/test_integration_obstruction_real_git.py" = ["PLR0911"]
"ralph/display/**/*.py" = ["PLC0415"]
"ralph/mcp/tools/_validation_retry_hints.py" = [
    "PLC0415",
]
"ralph/mcp/tools/coordination.py" = [
    "PLC0415",
]
"ralph/**/*.py" = ["E501"]
"ralph/mcp/explore/**/*.py" = [
    "PLC0415",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF012",
    "TC003",
]
"ralph/mcp/tools/workspace/**/*.py" = [
    "PLC0415",
    "TC003",
    "PLR0911",
    "PLR0912",
    "PLR0915",
]
"ralph/mcp/server/_host_contention_signal.py" = [
    "TC003",
]
"ralph/pipeline/**/*.py" = [
    "PLC0415",
]
"ralph/agents/invoke/_workspace.py" = [
    "PLC0415",
]
"ralph/diagnostics/**/*.py" = [
    "PLC0415",
]
"ralph/phases/**/*.py" = [
    "PLC0415",
]

[tool.ruff.lint.pylint]
max-args = 41
max-statements = 60
max-branches = 14



[tool.ruff.lint.isort]
known-first-party = ["ralph", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "ralph.pydantic_compat.RalphBaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.vulture]
paths = ["ralph", "tests"]
min_confidence = 100
sort_by_size = true
ignore_names = [
    "html_partial",
    "separator",
    "from_attributes",
    "by_alias",
    "by_name",
    "raise_errors",
    "deep",
    "strict",
    "extra",
    "context",
    "mode",
    "exclude_unset",
    "exclude_defaults",
    "exclude_none",
    "round_trip",
    "warnings",
    "force",
    "indent",
    "ensure_ascii",
    "update",
    "broker_secret_in_parent",
    "patched_waiting_strategy",
]


[tool.coverage.run]
source = ["ralph"]
data_file = ".coverage.pytest"
omit = ["ralph/testing/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.20.1",
    "pathspec>=1.0.4",
    "types-psutil",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.1",
    "types-tqdm>=4.67.3.20260518",
]

[tool.ralph.dependency-evidence.bandit]
publisher = "PyCQA"
registry = "https://pypi.org/simple"
