[tool.ruff.lint.pylint]
max-args = 41
max-statements = 60
max-branches = 14



[tool.ruff.lint.isort]
known-first-party = ["ralph", "tests"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel", "ralph.pydantic_compat.RalphBaseModel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.vulture]
paths = ["ralph", "tests"]
min_confidence = 100
sort_by_size = true
ignore_names = [
    "html_partial",
    "separator",
    "from_attributes",
    "by_alias",
    "by_name",
    "raise_errors",
    "deep",
    "strict",
    "extra",
    "context",
    "mode",
    "exclude_unset",
    "exclude_defaults",
    "exclude_none",
    "round_trip",
    "warnings",
    "force",
    "indent",
    "ensure_ascii",
    "update",
    "broker_secret_in_parent",
    "patched_waiting_strategy",
]


[tool.coverage.run]
source = ["ralph"]
data_file = ".coverage.pytest"
omit = ["ralph/testing/*"]

[tool.coverage.report]
exclude_lines = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.20.1",
    "pathspec>=1.0.4",
    "types-psutil",
    "hypothesis>=6.100",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.6",
    "ruff>=0.1",
    "types-tqdm>=4.67.3.20260518",
]

[tool.ralph.dependency-evidence.bandit]
publisher = "PyCQA"
registry = "https://pypi.org/simple"
