when:
  - event: [push, pull_request, pull_request_metadata]

steps:
  checks:
    image: python:3.12-bookworm
    commands:
      - cd ralph-workflow && python -m ralph.contrib.cla
      - pip install --upgrade uv
      - apt-get update && apt-get install --yes --no-install-recommends ruby
      - cd ralph-workflow && make verify
